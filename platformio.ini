; ============================================================================
;  VESC CYD Dash  -  ESP32-2432S028 ("Cheap Yellow Display") e-bike dashboard
;                    + transparent VESC Tool BLE bridge
;
;  Two environments are provided:
;    cyd_resistive  : boards with the XPT2046 resistive panel (SPI) - default
;    cyd_capacitive : boards with a CST820 / GT911 capacitive panel (I2C)
;
;  The plain "ESP32-2432S028R" (the one most shops ship) is RESISTIVE.
;  Build cyd_resistive unless you know your panel is capacitive.
;
;  Plus two Waveshare ESP32-C6 boards (c6_lcd19, c6_lcd147) and the
;  Waveshare ESP32-S3-Touch-AMOLED-1.64 (s3_amoled164) - see their sections.
;
;  Every board env also has a *_uart twin (cyd_resistive_uart, ...) that
;  talks to the VESC over its COMM-port UART instead of CAN - see the end of
;  this file and section 1 of include/config.h.
; ============================================================================

[platformio]
default_envs = cyd_resistive

[env]
platform      = espressif32@6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^1.4.2

; ui_c6.cpp/vesc_can_idf5.cpp (the C6 and AMOLED boards' renderer and CAN
; transport) pull in Arduino_GFX_Library.h/esp_twai.h, neither of which
; exist for this platform/lib_deps - exclude them here so the CYD envs
; don't try to compile them. The C6 and AMOLED envs define their own
; build_src_filter excluding the reverse.
build_src_filter =
    +<*>
    -<ui_c6.cpp>
    -<vesc_can_idf5.cpp>

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
    ; ---------------------------------------------------------------
    ; TFT_eSPI configuration for the ESP32-2432S028 (ILI9341, 240x320)
    ; Supplied here so you never have to edit User_Setup.h in the lib.
    ; ---------------------------------------------------------------
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1          ; if colours look inverted, swap to -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    ; TFT runs on VSPI (default). The resistive touch controller gets HSPI.
    ; If your board refuses to init the panel, add -DUSE_HSPI_PORT here and
    ; change TOUCH_SPI_HOST to VSPI in include/config.h.
    ; ---------------------------------------------------------------
    ; NimBLE trimming
    ; ---------------------------------------------------------------
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; ----------------------------------------------------------------------------
[env:cyd_capacitive]
build_flags =
    ${env.build_flags}
    -DTOUCH_CAPACITIVE=1

; ----------------------------------------------------------------------------
[env:cyd_resistive]
build_flags =
    ${env.build_flags}
    -DTOUCH_RESISTIVE=1

; ----------------------------------------------------------------------------
;  ESP32-C6-LCD-1.9 (Waveshare, touch variant) - a different chip family
;  (RISC-V, single core) on a different toolchain generation, so this env is
;  fully self-contained rather than inheriting [env]'s platform/lib_deps/
;  build_flags, which are TFT_eSPI/ILI9341-specific and wrong for this board.
;
;  The official PlatformIO "espressif32" platform does not support ESP32-C6
;  with the Arduino framework - this uses the community pioarduino fork
;  instead (ships Arduino core 3.3.11 / IDF 5.5.5). TFT_eSPI does not
;  reliably support this chip either (open upstream issues), so this target
;  uses Arduino_GFX_Library instead, same as Waveshare's own examples for
;  this board. See src/ui_c6.cpp and src/vesc_can_idf5.cpp.
; ----------------------------------------------------------------------------
[env:c6_lcd19]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board         = esp32-c6-devkitc-1
framework     = arduino
monitor_speed = 115200

lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
    h2zero/NimBLE-Arduino@^2.1.3

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
    -DBOARD_C6_LCD19=1
    ; ---------------------------------------------------------------
    ; NimBLE trimming (same as the CYD envs)
    ; ---------------------------------------------------------------
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; the CYD-only transport/renderer are excluded; ui_c6.cpp / vesc_can_idf5.cpp
; take their place (both still match the default +<*> below).
build_src_filter =
    +<*>
    -<vesc_can.cpp>
    -<ui.cpp>

; ----------------------------------------------------------------------------
;  ESP32-C6-Touch-LCD-1.47 (Waveshare) - same chip/toolchain situation as
;  c6_lcd19 above (see that env's comment for why the platform/lib_deps
;  differ from the CYD envs), but a different display driver (JD9853, not
;  ST7789V2) and a different touch controller (AXS5106L, not the CST8xx
;  family) - both need their own code paths, gated on BOARD_C6_LCD147 in
;  ui_c6.cpp / touch_input.cpp respectively. The VESC link's pins are
;  GPIO7 (free) and GPIO3, the TF card's MISO - this project has no use for
;  the card, and the LCD itself never needed MISO since it's write-only.
;  See the VESC_LINK_TX_PIN/RX_PIN comment in config.h for why those two
;  specifically (not any of the other pins that looked free) - most of what
;  looks spare on this board is an ESP32-C6 strapping pin.
; ----------------------------------------------------------------------------
[env:c6_lcd147]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board         = esp32-c6-devkitc-1
framework     = arduino
monitor_speed = 115200

lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
    h2zero/NimBLE-Arduino@^2.1.3

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
    -DBOARD_C6_LCD147=1
    ; ---------------------------------------------------------------
    ; NimBLE trimming (same as the other envs)
    ; ---------------------------------------------------------------
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; same shared ui_c6.cpp / vesc_can_idf5.cpp as c6_lcd19 - board differences
; are handled inside those files via #if defined(BOARD_C6_LCD147).
build_src_filter =
    +<*>
    -<vesc_can.cpp>
    -<ui.cpp>

; ----------------------------------------------------------------------------
;  ESP32-S3-Touch-AMOLED-1.64 (Waveshare) - ESP32-S3R8 (16 MB flash, 8 MB
;  octal PSRAM), a 280x456 CO5300 AMOLED over QSPI and an FT3168 touch panel.
;  Same pioarduino platform and libraries as the C6 boards: Arduino_GFX has
;  the CO5300 driver, and ui_c6.cpp / vesc_can_idf5.cpp handle this board via
;  #if defined(BOARD_S3_AMOLED164). The PSRAM matters - ui_c6.cpp draws into
;  a 255 KB framebuffer there (see TrackedCanvas for why), hence the N16R8
;  board definition. Its USB-C port is the S3's own USB, with no USB-UART
;  chip in between, so the serial console needs USB CDC turned on at boot.
; ----------------------------------------------------------------------------
[env:s3_amoled164]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board         = esp32-s3-devkitc1-n16r8
framework     = arduino
monitor_speed = 115200

lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
    h2zero/NimBLE-Arduino@^2.1.3

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
    -DBOARD_S3_AMOLED164=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ---------------------------------------------------------------
    ; NimBLE trimming (same as the other envs)
    ; ---------------------------------------------------------------
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; same exclusions as the C6 envs: the CYD-only transport and renderer
build_src_filter =
    +<*>
    -<vesc_can.cpp>
    -<ui.cpp>

; ----------------------------------------------------------------------------
;  UART builds - the same five boards, wired straight to the VESC's COMM port
;  instead of through a CAN transceiver. Each is identical to the env it
;  extends apart from VESC_LINK_UART=1; section 1b of include/config.h has the
;  wiring, the VESC Tool settings it needs, and what UART gives up vs. CAN.
; ----------------------------------------------------------------------------
[env:cyd_capacitive_uart]
extends = env:cyd_capacitive
build_flags =
    ${env:cyd_capacitive.build_flags}
    -DVESC_LINK_UART=1

[env:cyd_resistive_uart]
extends = env:cyd_resistive
build_flags =
    ${env:cyd_resistive.build_flags}
    -DVESC_LINK_UART=1

[env:c6_lcd19_uart]
extends = env:c6_lcd19
build_flags =
    ${env:c6_lcd19.build_flags}
    -DVESC_LINK_UART=1

[env:c6_lcd147_uart]
extends = env:c6_lcd147
build_flags =
    ${env:c6_lcd147.build_flags}
    -DVESC_LINK_UART=1

[env:s3_amoled164_uart]
extends = env:s3_amoled164
build_flags =
    ${env:s3_amoled164.build_flags}
    -DVESC_LINK_UART=1
